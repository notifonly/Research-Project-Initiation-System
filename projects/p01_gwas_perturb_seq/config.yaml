project_id: p01_gwas_perturb_seq
name: GWAS + perturb-seq causal gene mapping
archetype_id: archetype_a_v2g
research_direction: >
  Identify causal genes at GWAS lead loci by integrating GWAS summary statistics
  with perturb-seq (CRISPRi/a + single-cell RNA-seq) functional screens.
  Triangulate variant-to-gene (V2G) evidence: eQTL/pQTL colocalization,
  perturb-seq gene-knockout expression shifts, and fine-mapping to nominate
  high-confidence therapeutic targets.

description: >
  Prototype A (V2G) project. Divergent Step 6 searches scPerturb, GEARS, and GEO
  for perturb-seq datasets matching GWAS lead-locus genes. The divergent skill
  s6a_perturb_seq_search is inserted into the inner loop between literature
  screening (s6) and evidence card extraction (s7).

divergent_step:
  sid: s6a_perturb_seq_search
  description: Search scPerturb + GEARS + GEO for perturb-seq datasets per locus gene
  mcps:
    - scperturb
    - geo
    - github
    - papers_with_code

skill_sequence:
  - s1_direction_decompose
  - s2_terminology_normalize
  - s3_v2g_locus_collect
  - s4_multi_source_search
  - s5_citation_snowball
  - s6_literature_screening
  - s6a_perturb_seq_search
  - s7_evidence_card_extract
  - s8_data_availability
  - s9_method_dataset_match
  - s10_functional_evidence_search
  - s11_gap_analysis
  - s12_hypothesis_generate

parameters:
  max_loci_per_trait: 50
  max_study_variant_pairs_l2g: 50
  coloc_pp4_threshold: 0.8
  significance_p_threshold: 5.0e-8
  perturb_seq_search_max_genes: 30
  perturb_seq_assay_keywords:
    - perturb-seq
    - CRISPRi
    - CRISPRa
    - genome-wide perturb-seq
    - CROP-seq
    - TAP-seq
  gears_model_check: true

mcp_priorities:
  high:
    - gwas_catalog
    - open_targets
    - semantic_scholar
    - pubmed
    - scperturb
  medium:
    - geo
    - cellxgene
    - ensembl
    - encode
  low:
    - biorxiv
    - openreview
    - github
    - papers_with_code
    - huggingface

breakpoints:
  - bp1_direction_decompose
  - bp2_locus_terminology
  - bp3_l1_to_l2
  - bp4_reading_list
  - bp5_evidence_card_overview
  - bp6_gap_hypothesis
  - bp7_final_map

convergence:
  candidate_driven: true
  candidate_source: decompose_pilot_results
  max_candidates: 3
  min_candidate_score: 0.0
  candidate_order: shuffle
  inner_loop_or:
    - query_exhausted
    - citation_closed
    - reflection_confirmed
    - budget_token_exceeded
  outer_loop_and:
    - coverage_jaccard_gt_0.95_k2
    - gap_yield_lt_20pct_new
    - citation_network_closed
  budget_failsafe: always_active
